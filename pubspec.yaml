name: pelajarku
description: Planner sekolah Indonesia untuk Android dan iOS.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.20.3
  sqflite: ^2.4.3
  path: ^1.9.1
  uuid: ^4.6.0
  flutter_local_notifications: ^22.1.0
  timezone: ^0.11.1
  image_picker: ^1.2.4
  google_mlkit_text_recognition: ^0.17.1
  file_picker: ^13.2.0
  pdfx: ^2.11.0
  path_provider: ^2.1.5
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_functions: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
